name: QA A11-2 Sertifikat PDF QR Versi

on:
  pull_request:
    paths:
      - 'app/Services/SertifikatAsetService.php'
      - 'app/Services/SertifikatPdfService.php'
      - 'app/Services/SertifikatPenerbitanService.php'
      - 'app/Services/KelayakanSertifikatService.php'
      - 'app/Controllers/AdminSertifikat.php'
      - 'app/Controllers/AdminSertifikatAset.php'
      - 'app/Controllers/AdminSertifikatTerbit.php'
      - 'app/Controllers/SiswaSertifikat.php'
      - 'app/Controllers/VerifikasiSertifikat.php'
      - 'app/Views/admin/sertifikat_aset.php'
      - 'app/Views/admin/sertifikat_kelayakan.php'
      - 'app/Views/siswa/sertifikat.php'
      - 'app/Views/publik/verifikasi_sertifikat.php'
      - 'app/Config/Routes.php'
      - 'app/Services/NavigasiService.php'
      - 'tests/unit/SertifikatPenerbitanDatabaseTest.php'
      - 'database/sql/updates/V4-0011-SERTIFIKAT-ASSET-DAN-VERSI.sql'
      - 'tests/scripts/a11_sql_patch_mariadb.php'
      - '.github/workflows/qa-a11-2-sertifikat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, gd, sqlite3, pdo_sqlite, dom, xml, zip, fileinfo
          coverage: none
      - name: Setup writable
        run: mkdir -p writable/private/sertifikat/aset writable/private/sertifikat/pdf writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP A11-2
        run: |
          for f in \
            app/Services/SertifikatAsetService.php \
            app/Services/SertifikatPdfService.php \
            app/Services/SertifikatPenerbitanService.php \
            app/Services/KelayakanSertifikatService.php \
            app/Controllers/AdminSertifikat.php \
            app/Controllers/AdminSertifikatAset.php \
            app/Controllers/AdminSertifikatTerbit.php \
            app/Controllers/SiswaSertifikat.php \
            app/Controllers/VerifikasiSertifikat.php \
            app/Views/admin/sertifikat_aset.php \
            app/Views/admin/sertifikat_kelayakan.php \
            app/Views/siswa/sertifikat.php \
            app/Views/publik/verifikasi_sertifikat.php \
            app/Config/Routes.php \
            app/Services/NavigasiService.php \
            tests/unit/SertifikatPenerbitanDatabaseTest.php; do
            php -l "$f"
          done
      - name: PHPUnit sertifikat aset, PDF, QR dan histori
        run: vendor/bin/phpunit --no-coverage tests/unit/SertifikatPenerbitanDatabaseTest.php
      - name: PHPUnit A11-1 kelayakan
        run: vendor/bin/phpunit --no-coverage tests/unit/KelayakanSertifikatDatabaseTest.php

  sql-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: a11-fixture-only
          MARIADB_DATABASE: a11_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pa11-fixture-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Lint SQL smoke
        run: php -l tests/scripts/a11_sql_patch_mariadb.php
      - name: Uji skema additive pada MariaDB 10.4 TANPA data siswa asli
        run: php tests/scripts/a11_sql_patch_mariadb.php
