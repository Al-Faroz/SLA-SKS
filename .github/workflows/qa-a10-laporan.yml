name: QA A10 Laporan Akademik Siswa dan Pimpinan

on:
  pull_request:
    paths:
      - 'app/Config/Routes.php'
      - 'app/Controllers/SiswaLaporan.php'
      - 'app/Controllers/PimpinanLaporan.php'
      - 'app/Services/LaporanAkademikService.php'
      - 'app/Services/NavigasiService.php'
      - 'app/Views/siswa/laporan_daftar.php'
      - 'app/Views/pimpinan/laporan.php'
      - 'app/Views/laporan/detail.php'
      - 'app/Views/akun/beranda.php'
      - 'public/assets/css/app.css'
      - 'public/assets/css/emerald-glass.css'
      - 'tests/unit/LaporanAkademikDatabaseTest.php'
      - '.github/workflows/qa-a10-laporan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laporan-akademik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, dom, xml, zip, fileinfo
          coverage: none
      - name: Siapkan folder CI4
        run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pemeriksaan sintaks PHP A10
        run: |
          for f in \
            app/Config/Routes.php \
            app/Controllers/SiswaLaporan.php \
            app/Controllers/PimpinanLaporan.php \
            app/Services/LaporanAkademikService.php \
            app/Services/NavigasiService.php \
            app/Views/siswa/laporan_daftar.php \
            app/Views/pimpinan/laporan.php \
            app/Views/laporan/detail.php \
            app/Views/akun/beranda.php \
            tests/unit/LaporanAkademikDatabaseTest.php; do
            php -l "$f"
          done
      - name: Tes integrasi SQLite sintetis A10
        run: vendor/bin/phpunit --no-coverage tests/unit/LaporanAkademikDatabaseTest.php
