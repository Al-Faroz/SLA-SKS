name: QA Pratinjau Impor ATP v2.5

on:
  pull_request:
    paths:
      - 'app/Services/AtpExcelParserService.php'
      - 'app/Services/AtpImporPratinjauService.php'
      - 'app/Controllers/GuruAtpPratinjau.php'
      - 'app/Views/guru/pratinjau_atp.php'
      - 'app/Views/guru/semester_atp.php'
      - 'app/Config/Routes.php'
      - 'tests/unit/AtpExcelParserServiceTest.php'
      - '.github/workflows/qa-v25-pratinjau-atp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-qa:
    name: PHP 8.2 lint, XLSX parser and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, mbstring, dom, xml, fileinfo, gd, mysqli
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint new PHP sources
        run: |
          php -l app/Services/AtpExcelParserService.php
          php -l app/Services/AtpImporPratinjauService.php
          php -l app/Controllers/GuruAtpPratinjau.php
          php -l app/Views/guru/pratinjau_atp.php
          php -l app/Views/guru/semester_atp.php
          php -l app/Config/Routes.php
          php -l tests/unit/AtpExcelParserServiceTest.php
      - name: Unit parser and workbook regression
        run: vendor/bin/phpunit --no-coverage --filter 'AtpExcelParserServiceTest|AtpManualTemplateTest|AtpUnduhanServiceTest'
