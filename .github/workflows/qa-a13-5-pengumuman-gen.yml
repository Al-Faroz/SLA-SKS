name: QA A13-5 Pengumuman Guru per Gen

on:
  pull_request:
    paths:
      - 'app/Services/InformasiGlobalService.php'
      - 'app/Views/informasi/**'
      - 'tests/unit/InformasiGlobalDatabaseTest.php'
      - 'tests/integration/PengumumanGuruGenMariaDbTest.php'
      - '.github/workflows/qa-a13-5-pengumuman-gen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, dom, xml, zip, fileinfo
          coverage: none
      - run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint perubahan
        run: |
          for f in app/Services/InformasiGlobalService.php \
                   app/Views/informasi/pengumuman.php \
                   app/Views/informasi/editor.php \
                   app/Views/informasi/kelola.php \
                   tests/unit/InformasiGlobalDatabaseTest.php \
                   tests/integration/PengumumanGuruGenMariaDbTest.php; do
            php -l "$f"
          done
      - name: Regresi Pengumuman/FAQ SQLite
        run: vendor/bin/phpunit --no-coverage tests/unit/InformasiGlobalDatabaseTest.php
      - name: Regresi grup navigasi dan sandi A13-4
        run: vendor/bin/phpunit --no-coverage tests/unit/A13RevisiAkunNavigasiTest.php

  mariadb-scope:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: sla_a13_gen_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SLA_TEST_DB_DSN: 'mysql:dbname=sla_a13_gen_test;host=127.0.0.1;port=3306;charset=utf8mb4'
      SLA_TEST_DB_USER: root
      SLA_TEST_DB_PASS: testroot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, sqlite3, pdo_sqlite, mbstring, intl, gd, dom, xml, zip, fileinfo
          coverage: none
      - run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: SQL scope Service langsung pada MariaDB sintetis
        run: vendor/bin/phpunit --no-coverage tests/integration/PengumumanGuruGenMariaDbTest.php
