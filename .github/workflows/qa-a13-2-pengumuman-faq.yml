name: QA A13-2 Pengumuman dan FAQ

on:
  pull_request:
    paths:
      - 'app/Services/InformasiGlobalService.php'
      - 'app/Controllers/Informasi.php'
      - 'app/Controllers/Bantuan.php'
      - 'app/Config/Routes.php'
      - 'app/Services/NavigasiService.php'
      - 'app/Views/informasi/**'
      - 'app/Views/bantuan/index.php'
      - 'public/assets/css/app.css'
      - 'database/sql/updates/V4-0012_PENGUMUMAN_FAQ.sql'
      - 'database/sql/README.md'
      - 'tests/unit/InformasiGlobalDatabaseTest.php'
      - 'tests/integration/SqlA13InformasiSchemaCheck.php'
      - '.github/workflows/qa-a13-2-pengumuman-faq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  informasi:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: sla_a13_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SLA_TEST_DB_DSN: 'mysql:dbname=sla_a13_test;host=127.0.0.1;port=3306;charset=utf8mb4'
      SLA_TEST_DB_USER: root
      SLA_TEST_DB_PASS: testroot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo_mysql, sqlite3, pdo_sqlite, mbstring, intl, gd, dom, xml, zip, fileinfo
          coverage: none
      - name: Direktori writable
        run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint perubahan
        run: |
          for f in \
            app/Services/InformasiGlobalService.php \
            app/Controllers/Informasi.php \
            app/Controllers/Bantuan.php \
            app/Views/informasi/pengumuman.php \
            app/Views/informasi/kelola.php \
            app/Views/informasi/editor.php \
            app/Views/bantuan/index.php \
            app/Config/Routes.php \
            app/Services/NavigasiService.php \
            tests/unit/InformasiGlobalDatabaseTest.php \
            tests/integration/SqlA13InformasiSchemaCheck.php; do
            php -l "$f"
          done
      - name: Uji service SQLite anonim, hak akses, draf, audit dan paginasi
        run: vendor/bin/phpunit --no-coverage tests/unit/InformasiGlobalDatabaseTest.php
      - name: Regresi A13-1 panduan Bantuan
        run: vendor/bin/phpunit --no-coverage tests/unit/PanduanBantuanServiceTest.php
      - name: SQL V4-0012 pada MariaDB sementara
        run: php tests/integration/SqlA13InformasiSchemaCheck.php
