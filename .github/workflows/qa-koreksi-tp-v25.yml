name: QA Koreksi TP Siap dan Sunting CP Aktif

on:
  pull_request:
    paths:
      - 'app/Services/KoreksiTpService.php'
      - 'app/Controllers/GuruKoreksiTp.php'
      - 'app/Controllers/AdminKoreksiTp.php'
      - 'app/Config/Routes.php'
      - 'app/Views/guru/koreksi_tp_*.php'
      - 'app/Views/admin/koreksi_tp_*.php'
      - 'app/Views/admin/kurikulum_cp.php'
      - 'app/Views/guru/detail_tp.php'
      - 'tests/unit/KoreksiTpServiceV25Test.php'
      - 'database/sql/updates/V4-0006_KOREKSI_TP_SIAP.sql'
      - '.github/workflows/qa-koreksi-tp-v25.yml'
  workflow_dispatch:

jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, intl, zip, pdo_mysql
          coverage: none
      - name: Dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Sintaks dan izin route
        run: |
          for f in app/Services/KoreksiTpService.php app/Controllers/GuruKoreksiTp.php app/Controllers/AdminKoreksiTp.php app/Config/Routes.php app/Views/guru/koreksi_tp_daftar.php app/Views/guru/koreksi_tp_edit.php app/Views/admin/koreksi_tp_daftar.php app/Views/admin/koreksi_tp_detail.php app/Views/admin/kurikulum_cp.php app/Views/guru/detail_tp.php tests/unit/KoreksiTpServiceV25Test.php; do php -l "$f"; done
      - name: Unit keamanan snapshot/versi dan CP
        run: vendor/bin/phpunit --no-coverage tests/unit/KoreksiTpServiceV25Test.php

  sql-mariadb:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -ptesting --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Instal client MariaDB
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Buat FK minimal, impor SQL V4-0006 dua kali dan uji UNIQUE draf
        shell: bash
        run: |
          set -euo pipefail
          DB="mariadb -h 127.0.0.1 -P 3306 -u root -ptesting"
          $DB -e "CREATE DATABASE IF NOT EXISTS sla_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          $DB sla_qa <<'SQL'
          CREATE TABLE pengguna (id BIGINT UNSIGNED NOT NULL PRIMARY KEY) ENGINE=InnoDB;
          CREATE TABLE tp (id BIGINT UNSIGNED NOT NULL PRIMARY KEY) ENGINE=InnoDB;
          CREATE TABLE versi_konten_tp (id BIGINT UNSIGNED NOT NULL PRIMARY KEY, tp_id BIGINT UNSIGNED NOT NULL,
            CONSTRAINT fk_test_tp FOREIGN KEY(tp_id) REFERENCES tp(id)) ENGINE=InnoDB;
          CREATE TABLE schema_version (versi VARCHAR(40) NOT NULL PRIMARY KEY,
            diterapkan_pada TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP) ENGINE=InnoDB;
          INSERT INTO pengguna VALUES (1),(2);
          INSERT INTO tp VALUES (23);
          INSERT INTO versi_konten_tp VALUES (1,23);
          SQL
          $DB sla_qa < database/sql/updates/V4-0006_KOREKSI_TP_SIAP.sql
          $DB sla_qa < database/sql/updates/V4-0006_KOREKSI_TP_SIAP.sql
          COUNT=$($DB -N sla_qa -e "SELECT COUNT(*) FROM schema_version WHERE versi='V4-0006-KOREKSI-TP-SIAP'")
          test "$COUNT" = 1
          $DB sla_qa -e "INSERT INTO permohonan_koreksi_tp (tp_id,versi_dasar_id,guru_id,kategori,alasan,status,usulan_json,checksum_dasar,dibuat_pada) VALUES (23,1,1,'A','Uji koreksi akademik','draf','{}',REPEAT('a',64),NOW());"
          if $DB sla_qa -e "INSERT INTO permohonan_koreksi_tp (tp_id,versi_dasar_id,guru_id,kategori,alasan,status,usulan_json,checksum_dasar,dibuat_pada) VALUES (23,1,1,'B','Draf duplikat','draf','{}',REPEAT('b',64),NOW());" 2>/dev/null; then
            echo "FAIL: dua permohonan terbuka berhasil dibuat"; exit 1
          fi
          $DB sla_qa -e "UPDATE permohonan_koreksi_tp SET status='ditolak' WHERE tp_id=23;"
          $DB sla_qa -e "INSERT INTO permohonan_koreksi_tp (tp_id,versi_dasar_id,guru_id,kategori,alasan,status,usulan_json,checksum_dasar,dibuat_pada) VALUES (23,1,1,'B','Draf sesudah penolakan','draf','{}',REPEAT('b',64),NOW());"
          echo "SQL V4-0006: impor ulang aman, satu permohonan aktif per TP dan histori setelah ditolak PASS"
