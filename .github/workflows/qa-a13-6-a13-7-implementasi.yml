name: QA A13-6 A13-7 Implementasi

on:
  pull_request:
    paths:
      - 'app/Services/NotifikasiService.php'
      - 'app/Services/KebijakanPrivasiService.php'
      - 'app/Services/PenilaianGuruService.php'
      - 'app/Services/KeputusanUjianBatalService.php'
      - 'app/Services/PermintaanAksesUlangSiswaService.php'
      - 'app/Services/SertifikatPenerbitanService.php'
      - 'app/Services/KesiapanTpService.php'
      - 'app/Controllers/Notifikasi.php'
      - 'app/Controllers/AdminKebijakanPrivasi.php'
      - 'app/Controllers/Publik.php'
      - 'app/Views/**'
      - 'app/Config/Routes.php'
      - 'database/sql/updates/V4-0013_NOTIFIKASI_PRIVASI.sql'
      - 'tests/unit/A13NotifikasiPrivasiDatabaseTest.php'
      - 'tests/integration/SqlA13NotifikasiPrivasiSchemaCheck.php'
      - '.github/workflows/qa-a13-6-a13-7-implementasi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, dom, xml, zip, fileinfo
          coverage: none
      - run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          for f in app/Services/NotifikasiService.php app/Services/KebijakanPrivasiService.php \
              app/Services/NotifikasiKontrakService.php app/Services/KebijakanPrivasiValidasiService.php \
              app/Services/PenilaianGuruService.php app/Services/SertifikatPenerbitanService.php \
              app/Services/KesiapanTpService.php app/Services/KeputusanUjianBatalService.php \
              app/Services/PermintaanAksesUlangSiswaService.php app/Controllers/Publik.php \
              app/Controllers/Notifikasi.php app/Controllers/AdminKebijakanPrivasi.php \
              app/Views/notifikasi/index.php app/Views/admin/kebijakan_privasi.php \
              app/Views/admin/kebijakan_privasi_editor.php app/Views/publik/kebijakan_privasi.php \
              app/Views/layouts/panel.php tests/unit/A13KontrakNotifikasiPrivasiTest.php \
              tests/unit/A13NotifikasiPrivasiDatabaseTest.php; do
            php -l "$f"
          done
      - name: PHPUnit modul baru dan regresi
        run: |
          vendor/bin/phpunit --no-coverage tests/unit/A13KontrakNotifikasiPrivasiTest.php
          vendor/bin/phpunit --no-coverage tests/unit/A13NotifikasiPrivasiDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/unit/InformasiGlobalDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/unit/PenilaianGuruDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/unit/KeputusanUjianBatalDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/unit/SertifikatPenerbitanDatabaseTest.php
          vendor/bin/phpunit --no-coverage tests/unit/A13RevisiAkunNavigasiTest.php

  mariadb-patch:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_test
          MARIADB_DATABASE: sla_a13_67_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SLA_TEST_DB_DSN: 'mysql:dbname=sla_a13_67_test;host=127.0.0.1;port=3306;charset=utf8mb4'
      SLA_TEST_DB_USER: root
      SLA_TEST_DB_PASS: ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mysqli, mbstring, intl, dom, xml
          coverage: none
      - run: php tests/integration/SqlA13NotifikasiPrivasiSchemaCheck.php
