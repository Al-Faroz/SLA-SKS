name: QA Pratinjau YouTube Materi v2.4

on:
  pull_request:
    paths:
      - 'app/Services/VideoMateriService.php'
      - 'app/Services/MateriDrafService.php'
      - 'app/Controllers/GuruMateri.php'
      - 'app/Views/guru/**'
      - 'app/Config/Routes.php'
      - 'tests/unit/VideoMateriServiceTest.php'
      - '.github/workflows/qa-video-materi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-materi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, gd, zip, xml, dom
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          php -l app/Services/VideoMateriService.php
          php -l app/Services/MateriDrafService.php
          php -l app/Controllers/GuruMateri.php
          php -l app/Views/guru/materi_pratinjau.php
          php -l app/Views/guru/detail_tp.php
          php -l tests/unit/VideoMateriServiceTest.php
      - name: Unit parser URL YouTube
        run: vendor/bin/phpunit --no-coverage tests/unit/VideoMateriServiceTest.php
