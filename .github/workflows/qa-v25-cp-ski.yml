name: QA CP SKI v2.5 dan ATP stale reference

on:
  pull_request:
    paths:
      - 'app/Services/CpReferensiService.php'
      - 'app/Services/CpOperasionalService.php'
      - 'app/Services/AtpExcelParserService.php'
      - 'app/Services/AtpImporPratinjauService.php'
      - 'app/Controllers/AdminKurikulumCp.php'
      - 'app/Views/admin/kurikulum_cp.php'
      - 'database/sql/updates/V4-0002_CP_OPERASIONAL_SKI_PK.sql'
      - 'tests/fixtures/cp_ski_v4_qa.sql'
      - 'tests/unit/AtpExcelParserServiceTest.php'
      - '.github/workflows/qa-v25-cp-ski.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-unit:
    name: PHP 8.2 lint dan CP/ATP PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, dom, xml, gd, mysqli
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP syntax
        run: |
          php -l app/Services/CpReferensiService.php
          php -l app/Services/CpOperasionalService.php
          php -l app/Services/AtpExcelParserService.php
          php -l app/Services/AtpImporPratinjauService.php
          php -l app/Controllers/AdminKurikulumCp.php
          php -l app/Views/admin/kurikulum_cp.php
          php -l tests/unit/AtpExcelParserServiceTest.php
      - name: CP dan ATP unit tests
        run: vendor/bin/phpunit --no-coverage --filter 'K3AKurikulumCpTest|CpDaftarResponsifTest|AtpExcelParserServiceTest'

  mariadb:
    name: MariaDB 10.11 SQL patch, history and replay guard
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: sla_sks_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install SQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: Import synthetic fixture and CP change (not a private dump)
        run: |
          mariadb --protocol=tcp -h 127.0.0.1 -uroot sla_sks_qa < tests/fixtures/cp_ski_v4_qa.sql
          mariadb --protocol=tcp -h 127.0.0.1 -uroot sla_sks_qa < database/sql/updates/V4-0002_CP_OPERASIONAL_SKI_PK.sql
      - name: Assert exact CP, history unchanged and other element active
        run: |
          SQL="mariadb --protocol=tcp -h 127.0.0.1 -uroot -N -s sla_sks_qa"
          test "$($SQL -e "SELECT COUNT(*) FROM schema_version WHERE versi='V4-0002-CP-SKI-PK'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM ref_cp c JOIN ref_cp_versi v ON v.cp_id=c.id WHERE c.kode='KBC25-SKI-D-PK' AND v.status='aktif' AND v.elemen='Pemahaman Konsep' AND v.rumusan LIKE '%Wali Sanga%' AND v.rumusan LIKE '%organisasi kemasyarakatan Islam di Indonesia.%'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM ref_cp_versi WHERE id=2 AND status='diarsipkan'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM ref_cp_versi WHERE id=3 AND status='aktif' AND elemen='Keterampilan Proses'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM cp_mapel_elemen WHERE cp_mapel_id=1")" = "3"
          test "$($SQL -e "SELECT COUNT(*) FROM tp_cp WHERE id=1 AND tp_id=1 AND cp_versi_id=2")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM ref_cp WHERE kode='FD-SKI-01'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM ref_cp WHERE kode='FD-SKI-02'")" = "1"
          test "$($SQL -e "SELECT COUNT(*) FROM log_aktivitas WHERE peristiwa='cp_ski_pk_v25_diterbitkan'")" = "1"
      - name: Reimport must fail without creating another CP
        run: |
          if mariadb --protocol=tcp -h 127.0.0.1 -uroot sla_sks_qa < database/sql/updates/V4-0002_CP_OPERASIONAL_SKI_PK.sql; then
            echo "ERROR: Versioned SQL unexpectedly accepted a second import"
            exit 1
          fi
          test "$(mariadb --protocol=tcp -h 127.0.0.1 -uroot -N -s sla_sks_qa -e "SELECT COUNT(*) FROM ref_cp WHERE kode='KBC25-SKI-D-PK'")" = "1"
