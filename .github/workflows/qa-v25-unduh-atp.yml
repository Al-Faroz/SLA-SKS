name: QA Generator Unduh ATP v2.5

on:
  pull_request:
    paths:
      - 'app/Services/AtpUnduhanService.php'
      - 'app/Services/AtpDesainWorkbookService.php'
      - 'app/Controllers/GuruAtpUnduh.php'
      - 'app/Views/guru/semester_atp.php'
      - 'app/Config/Routes.php'
      - 'tests/unit/AtpUnduhanServiceTest.php'
      - 'tests/unit/AtpManualTemplateTest.php'
      - 'docs/TEMPLATE_ATP_SLA_SKS_v2_5_MANUAL_TANPA_MACRO.xlsx'
      - '.github/workflows/qa-v25-unduh-atp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-atp:
    name: PHP 8.2 lint dan XLSX round-trip (tanpa DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, gd, zip, dom, xml, fileinfo
          tools: composer:v2
          coverage: none
      - name: Instal composer.lock
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint PHP modul ATP
        run: |
          php -l app/Services/AtpUnduhanService.php
          php -l app/Services/AtpDesainWorkbookService.php
          php -l app/Controllers/GuruAtpUnduh.php
          php -l app/Views/guru/semester_atp.php
          php -l app/Config/Routes.php
          php -l tests/unit/AtpUnduhanServiceTest.php
          php -l tests/unit/AtpManualTemplateTest.php
      - name: PHPUnit workbook sumber dan generator
        run: vendor/bin/phpunit --no-coverage --filter 'AtpManualTemplateTest|AtpUnduhanServiceTest'
