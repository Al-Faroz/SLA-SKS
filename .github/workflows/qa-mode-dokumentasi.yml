name: QA Mode Dokumentasi Fullpage Global

on:
  pull_request:
    paths:
      - 'app/Views/layouts/panel.php'
      - 'public/assets/css/emerald-glass.css'
      - 'public/assets/js/theme-init.js'
      - 'public/assets/icons/lucide-sla.svg'
      - 'tests/unit/ModeDokumentasiShellTest.php'
      - '.github/workflows/qa-mode-dokumentasi.yml'
  workflow_dispatch:

jobs:
  regresi-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, zip, intl
          coverage: none
      - name: Instal dependensi
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint layout dan tes
        run: |
          php -l app/Views/layouts/panel.php
          php -l tests/unit/ModeDokumentasiShellTest.php
      - name: JavaScript syntax untuk mode dokumentasi dan menu
        run: |
          node --check public/assets/js/theme-init.js
          node --check public/assets/js/app.js
      - name: SVG ikon kamera valid
        run: php -r '$x=simplexml_load_file("public/assets/icons/lucide-sla.svg"); if (!$x || strpos(file_get_contents("public/assets/icons/lucide-sla.svg"), "id=\"camera\"") === false) exit(1);'
      - name: Test regresi layout global
        run: vendor/bin/phpunit --no-coverage tests/unit/ModeDokumentasiShellTest.php
