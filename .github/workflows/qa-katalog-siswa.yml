name: QA Katalog Pembelajaran Siswa

on:
  pull_request:
    paths:
      - 'app/Services/KatalogPembelajaranSiswaService.php'
      - 'app/Controllers/SiswaPembelajaran.php'
      - 'app/Views/siswa/**'
      - 'app/Views/akun/beranda.php'
      - 'app/Services/NavigasiService.php'
      - 'app/Config/Routes.php'
      - 'public/assets/css/app.css'
      - 'tests/unit/KatalogPembelajaranSiswaTest.php'
      - '.github/workflows/qa-katalog-siswa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pemeriksaan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, gd, zip, xml, dom, fileinfo
          coverage: none
      - name: Instal dependensi
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          php -l app/Services/KatalogPembelajaranSiswaService.php
          php -l app/Controllers/SiswaPembelajaran.php
          php -l app/Views/siswa/mapel.php
          php -l app/Views/siswa/semester.php
          php -l app/Views/siswa/daftar_tp.php
          php -l app/Views/siswa/rincian_tp.php
          php -l app/Views/akun/beranda.php
          php -l app/Services/NavigasiService.php
          php -l app/Config/Routes.php
          php -l tests/unit/KatalogPembelajaranSiswaTest.php
      - name: Unit test gate dan privasi Siswa
        run: vendor/bin/phpunit --no-coverage tests/unit/KatalogPembelajaranSiswaTest.php
