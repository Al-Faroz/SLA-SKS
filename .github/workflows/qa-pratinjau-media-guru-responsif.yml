name: QA Pratinjau Media Guru Responsif

on:
  pull_request:
    paths:
      - 'app/Views/guru/materi_pratinjau.php'
      - 'public/assets/css/app.css'
      - 'docs/13-DESIGN-SYSTEM-CSS.md'
      - 'docs/assets/galeri-komponen.html'
      - 'tests/unit/PratinjauMateriResponsifTest.php'
      - '.github/workflows/qa-pratinjau-media-guru-responsif.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, gd, zip, xml, dom, fileinfo
          coverage: none
      - name: Instal dependensi
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Pemeriksaan sintaks
        run: |
          php -l app/Views/guru/materi_pratinjau.php
          php -l tests/unit/PratinjauMateriResponsifTest.php
      - name: Regresi pratinjau media Guru
        run: vendor/bin/phpunit --no-coverage tests/unit/PratinjauMateriResponsifTest.php
