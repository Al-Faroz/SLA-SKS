name: QA Tabel Admin Responsif

on:
  pull_request:
    paths:
      - 'app/Views/admin/akun_daftar.php'
      - 'app/Views/admin/mapel_guru.php'
      - 'app/Views/components/pager.php'
      - 'app/Controllers/AdminReferensi.php'
      - 'app/Services/ReferensiService.php'
      - 'public/assets/css/app.css'
      - 'docs/13-DESIGN-SYSTEM-CSS.md'
      - 'docs/assets/galeri-komponen.html'
      - 'tests/unit/TabelAdminResponsifTest.php'
      - 'tests/unit/PaginationAdminTest.php'
      - '.github/workflows/qa-tabel-admin-responsif.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ui-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, intl, gd, zip, xml, dom, fileinfo
          coverage: none
      - name: Instal dependensi
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Periksa sintaks view dan tes
        run: |
          php -l app/Views/admin/akun_daftar.php
          php -l app/Views/admin/mapel_guru.php
          php -l app/Views/components/pager.php
          php -l app/Controllers/AdminReferensi.php
          php -l app/Services/ReferensiService.php
          php -l tests/unit/TabelAdminResponsifTest.php
          php -l tests/unit/PaginationAdminTest.php
      - name: Periksa struktur UI dan regresi aksi
        run: |
          vendor/bin/phpunit --no-coverage tests/unit/TabelAdminResponsifTest.php
          vendor/bin/phpunit --no-coverage tests/unit/PaginationAdminTest.php
