name: QA A13-3 Hubungi Admin

on:
  pull_request:
    paths:
      - 'app/Services/KontakResmiMadrasahService.php'
      - 'app/Controllers/HubungiAdmin.php'
      - 'app/Views/bantuan/hubungi_admin.php'
      - 'app/Views/bantuan/index.php'
      - 'app/Services/NavigasiService.php'
      - 'app/Config/Routes.php'
      - 'tests/unit/KontakResmiMadrasahServiceTest.php'
      - '.github/workflows/qa-a13-3-hubungi-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontak-resmi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, gd, dom, xml, zip, fileinfo
          coverage: none
      - name: Direktori writable
        run: mkdir -p writable/private writable/cache writable/logs writable/session writable/uploads writable/debugbar
      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP lint
        run: |
          for f in app/Services/KontakResmiMadrasahService.php \
                   app/Controllers/HubungiAdmin.php \
                   app/Views/bantuan/hubungi_admin.php \
                   app/Views/bantuan/index.php \
                   app/Services/NavigasiService.php \
                   app/Config/Routes.php \
                   tests/unit/KontakResmiMadrasahServiceTest.php; do
            php -l "$f"
          done
      - name: Uji kontak resmi dan perlindungan data
        run: vendor/bin/phpunit --no-coverage tests/unit/KontakResmiMadrasahServiceTest.php
      - name: Regresi panduan Bantuan
        run: vendor/bin/phpunit --no-coverage tests/unit/PanduanBantuanServiceTest.php
